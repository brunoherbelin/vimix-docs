name: Documentation proposal
description: Propose a documentation page without making a pull request
labels: ["documentation"]
body:
  - type: input
    id: title
    attributes:
      label: Feature name
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: vimix version
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What it does
      description: Brief description of the feature.
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How to
      description: Numbered steps. Drag and drop your annotated screenshots here or attach a zip.
    validations:
      required: true
  - type: textarea
    id: specific
    attributes:
      label: Specific information
      description: Shortcuts, limitations, platform differences.
  - type: input
    id: author
    attributes:
      label: Author name to credit
  - type: checkboxes
    id: license
    attributes:
      label: License
      options:
        - label: I agree to license this text and images under CC BY-SA 4.0
          required: true
