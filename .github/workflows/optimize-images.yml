name: Optimize screenshots

on:
  push:
    branches: ["main"]
    paths: ["pages/**/img/**"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resize and compress oversized PNG files
        run: |
          pip install pillow
          python3 scripts/optimize_images.py
      - name: Commit and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain pages)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pages
            git commit -m "Optimize screenshots"
            git push
            # pushes made with GITHUB_TOKEN do not trigger workflows: deploy explicitly
            gh workflow run pages.yml
          fi
